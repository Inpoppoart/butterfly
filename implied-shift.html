<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05060a;--panel:#0d1120;--panel2:#131a2e;
  --border:#1d2740;--border2:#2b3a5e;--text:#cdd8f0;--muted:#5a6b92;
  --green:#39ff8b;--gold:#ffd23f;--cyan:#5bd1ff;--red:#ff4d5e;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:Inter,-apple-system,system-ui,sans-serif;
  /* heat-map: diverging red↔blue, neutral midpoint — validated for CVD + dark surface */
  --heat-w3:#e66767;--heat-w2:#b84a4a;--heat-w1:#7a3b3b;
  --heat-mid:#383835;
  --heat-s1:#184f95;--heat-s2:#2a78d6;--heat-s3:#5598e7;
}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#0e1d38 0%,transparent 60%),var(--bg);
  color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:1020px;margin:0 auto;padding:.9rem .9rem 3rem}
.hdr{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);
  padding-bottom:.5rem;margin-bottom:.8rem}
.hdr h1{font-family:var(--mono);font-size:1.05rem;letter-spacing:.14em;color:var(--green)}
.hdr .sub{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.hud{display:flex;gap:1.1rem;font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:.7rem;flex-wrap:wrap}
.hud b{color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-bottom:.7rem}
.panel-title{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--muted);margin-bottom:.45rem}
.panel-title .conv{color:var(--cyan)}
.row{display:flex;align-items:baseline;gap:.9rem;padding:.28rem .5rem;border-radius:6px;border-left:3px solid transparent}
.row.leg{border-left-color:var(--border2);background:rgba(43,58,94,.14)}
.row.hot{animation:rowHot 2s ease-out}
@keyframes rowHot{0%{background:rgba(255,210,63,.22);border-left-color:var(--gold)}
  70%{background:rgba(255,210,63,.10);border-left-color:var(--gold)}100%{background:transparent}}
.tenor{font-family:var(--mono);font-weight:700;color:var(--gold);width:4.4rem;font-size:1rem}
.mkt{font-family:var(--mono);font-size:1.25rem;font-weight:600;white-space:nowrap}
.mkt .slash{color:var(--muted);font-weight:400}
.px{display:inline-block;padding:0 .15rem;border-radius:4px}
.px.flash-up{animation:flashUp 2s ease-out}
.px.flash-down{animation:flashDown 2s ease-out}
@keyframes flashUp{0%{background:rgba(57,255,139,.55);color:#04180c}60%{background:rgba(57,255,139,.18)}100%{background:transparent}}
@keyframes flashDown{0%{background:rgba(255,77,94,.55);color:#1c0407}60%{background:rgba(255,77,94,.18)}100%{background:transparent}}
.was{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:.3rem}
.screen{margin-bottom:.7rem;background:#000;border:1px solid #262c44;border-radius:8px;overflow:hidden}
.shead{display:grid;grid-template-columns:1.2rem minmax(2rem,1fr) auto auto auto minmax(2rem,1fr) 1.2rem;
  gap:.5rem;align-items:center;padding:.28rem .65rem;border-radius:6px;background:var(--panel2);
  font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;color:var(--muted);margin-bottom:.45rem}
.shead span:nth-child(4){text-align:center}
.shead .r{text-align:right}
.pad{background:#000;border:0;border-radius:0;margin:0;overflow:hidden}
.tenor-hd{display:none}
.rule{height:0;border-top:1px solid rgba(207,214,228,.55);margin:0}
.srow{display:grid;grid-template-columns:2.3rem minmax(2rem,1fr) auto 3px auto minmax(2rem,1fr) 2.3rem;
  gap:.5rem;align-items:center;padding:.28rem .65rem;border-radius:0}
.srow.mktrow{background:#0e1636}
.srow.mktrow .slab{color:#ffd23f}
.srow.bar{background:linear-gradient(180deg,#2137e4,#141fb4);grid-template-columns:1.2rem minmax(2rem,1fr) auto auto auto minmax(2rem,1fr) 1.2rem;padding:.26rem .65rem}
.tenor-mid{font-family:var(--mono);font-weight:700;color:#49ff62;font-size:1rem;letter-spacing:.06em;text-align:center;padding:0 .55rem;white-space:nowrap}
.srow.bar .slab{color:#49ff62;font-size:.92rem;letter-spacing:.05em}
.srow.bar .sprice{color:#ffe89c}
.srow.bar .sname{color:#cfeaff}
.srow.bar .sep{background:#8b9bff;box-shadow:none}
.pad .srow:not(.bar){border-top:1px solid rgba(207,214,228,.5)}
.pad .srow:not(.bar):first-child{border-top:0}
.srow.target{background:rgba(91,209,255,.10);outline:2px solid rgba(91,209,255,.55);outline-offset:-2px}
.srow.dimmed{opacity:.35}
.srow.shocked{background:rgba(255,210,63,.08);outline:1px solid rgba(255,210,63,.5);outline-offset:-1px}
.sprice.chg{background:rgba(255,210,63,.16);outline:1px solid rgba(255,210,63,.55)}
.task{display:flex;align-items:center;gap:.8rem;background:rgba(91,209,255,.06);border:1px solid rgba(91,209,255,.45);
  border-radius:10px;padding:.55rem .9rem;margin-bottom:.7rem}
.task-label{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:#04121c;background:var(--cyan);
  border-radius:4px;padding:.15rem .4rem;font-weight:700;white-space:nowrap}
.task-text{font-family:var(--mono);font-size:.98rem;font-weight:600}
.task-text b{color:var(--cyan)}
.task-was{color:var(--muted);font-weight:400;font-size:.8rem;margin-left:.4rem;white-space:nowrap}
.mkt-sm{font-family:var(--mono);font-size:.85rem;font-weight:600}
.anshdr{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--cyan)}
.opt.career{color:var(--cyan);opacity:.85}
.optbtn.reset{opacity:.7}
.slab{font-family:var(--mono);font-weight:700;font-size:.72rem;color:#5bd1ff;white-space:nowrap}
.slab.r{text-align:right}
.slab .tgt{color:var(--gold);font-size:.48rem;letter-spacing:.1em;border:1px solid rgba(255,210,63,.5);border-radius:4px;padding:0 .18rem;margin-left:.2rem}
.sname{font-family:var(--mono);font-size:.57rem;color:#59d0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.sname.l{text-align:right}
.sprice{font-family:var(--mono);font-size:1.12rem;font-weight:600;white-space:nowrap;border-radius:4px;padding:0 .12rem;color:#f2f5ff}
.sprice.off{text-align:right}
.sprice.dim{color:#333f5c}
.pxf{font-size:.58em;position:relative;top:-.42em;margin-left:.1em;font-weight:700}
.tick{color:#5bd1ff;font-size:.75em;position:relative;top:-.35em;margin-left:.06em;font-weight:700}
.sep{width:3px;align-self:stretch;background:#8fa2d8;border-radius:2px;box-shadow:0 0 5px rgba(143,162,216,.35)}

.btn:hover{border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.primary{color:#04180c;background:var(--green);border-color:var(--green);font-weight:700;font-size:.9rem}
.btn.end{padding:.28rem .7rem;font-size:.68rem}
.btnrow{display:flex;gap:.6rem;margin-top:.45rem;flex-wrap:wrap}
.optbtn{cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:.2rem .5rem;display:inline-block;
  margin:.15rem .35rem .15rem 0;-webkit-tap-highlight-color:transparent}
.optbtn:hover{border-color:var(--cyan)}
.implied-wrap{display:flex;gap:.7rem;flex-wrap:wrap}
.implied{flex:1 1 200px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;margin-bottom:.7rem}
.implied.target{border-color:var(--border2);box-shadow:0 0 12px rgba(91,209,255,.12)}
.imp-head{font-family:var(--mono);font-size:.8rem;color:var(--gold);display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.imp-head .formula{color:var(--muted);font-size:.68rem}
.imp-head .tgt{color:var(--cyan);font-size:.62rem;letter-spacing:.18em;border:1px solid var(--border2);border-radius:4px;padding:0 .3rem}
.imp-mkt{font-family:var(--mono);font-size:1.7rem;font-weight:700;margin:.15rem 0;white-space:nowrap}
.imp-mkt .slash{color:var(--muted);font-weight:400}
.imp-note{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.shock{display:flex;align-items:center;gap:.8rem;background:var(--panel2);border:1px solid var(--border2);
  border-radius:10px;padding:.6rem .9rem;margin-bottom:.7rem}
.shock-label{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--bg);
  background:var(--gold);border-radius:4px;padding:.15rem .4rem;font-weight:700}
.shock-text{font-family:var(--mono);font-size:1.05rem;font-weight:600}
.clock{margin-left:auto;font-family:var(--mono);font-size:1rem;color:var(--red);font-weight:700}
.ansform{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.7rem}
.ansform input{font-family:var(--mono);font-size:1.35rem;font-weight:600;color:var(--text);
  background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:.55rem .8rem;width:100%;outline:none}
.ansform input:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(91,209,255,.15)}
.hint{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.5rem}
.choice{display:flex;align-items:baseline;gap:.9rem;background:var(--panel);border:1px solid var(--border2);
  border-radius:10px;padding:.5rem .8rem;cursor:pointer}
.choice:hover{border-color:var(--cyan);box-shadow:0 0 8px rgba(91,209,255,.12)}
.cnum{font-family:var(--mono);font-weight:700;color:var(--green);font-size:1.05rem;min-width:1.2rem}
.err{font-family:var(--mono);font-size:.75rem;color:var(--red)}
.fb{border-radius:10px;padding:.7rem .9rem;margin-bottom:.7rem;border:1px solid}
.fb.ok{background:rgba(57,255,139,.07);border-color:rgba(57,255,139,.4)}
.fb.bad{background:rgba(255,77,94,.07);border-color:rgba(255,77,94,.45)}
.fb-line1{font-family:var(--mono);font-size:.95rem;font-weight:700;display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap}
.fb.ok .verdict{color:var(--green)}.fb.bad .verdict{color:var(--red)}
.fb-line1 .ms{color:var(--cyan);font-weight:400;font-size:.8rem}
.fb-line1 .stk{color:var(--muted);font-weight:400;font-size:.8rem}
.fb-ans{font-family:var(--mono);font-size:1.5rem;font-weight:700;margin:.25rem 0}
.fb-deriv{font-size:.85rem;color:var(--text);opacity:.9;margin:.2rem 0}
.fb-swap{font-family:var(--mono);font-size:.75rem;color:var(--gold)}
.fb-next{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:.3rem}
.keysbar{font-family:var(--mono);font-size:.65rem;color:var(--muted);text-align:center;margin-top:.4rem}
.keysbar b{color:var(--text)}
.menu .lvl{display:flex;gap:.8rem;align-items:baseline;padding:.5rem .6rem;border:1px solid var(--border);
  border-radius:8px;margin-bottom:.5rem;background:var(--panel)}
.menu .lvl .num{font-family:var(--mono);font-weight:700;color:var(--green);font-size:1.1rem}
.menu .lvl .nm{font-family:var(--mono);font-weight:600;color:var(--gold);width:6.5rem}
.menu .lvl .ds{font-size:.8rem;color:var(--muted)}
.menu .opt{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-top:.6rem}
.menu .opt b{color:var(--cyan)}
.tiles{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;min-width:100px;text-align:center}
.tile .v{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--green)}
.tile .l{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--muted);margin-top:.15rem}
.heat{border-collapse:separate;border-spacing:2px;width:100%;font-family:var(--mono)}
.heat th{font-size:.58rem;letter-spacing:.08em;color:var(--muted);font-weight:400;padding:.2rem .3rem;text-align:center}
.heat th.rowlab{text-align:left}
.heat td.rowlab{font-size:.68rem;color:var(--text);padding:.2rem .4rem;white-space:nowrap}
.heat td.cell{width:23%;text-align:center;border-radius:5px;padding:.3rem .2rem}
.heat td.cell .a{font-size:.85rem;font-weight:700}
.heat td.cell .m{font-size:.58rem;opacity:.85}
.heat td.cell.empty{background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.legend{display:flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:.5rem;flex-wrap:wrap}
.legend .sw{width:22px;height:12px;border-radius:3px;display:inline-block}
.testfail{background:rgba(255,77,94,.12);border:1px solid var(--red);border-radius:8px;padding:.6rem .8rem;
  font-family:var(--mono);font-size:.75rem;color:var(--red);margin-bottom:.8rem;white-space:pre-wrap}
.loadfail{font-family:var(--mono);color:var(--red);padding:2rem;text-align:center}

/* the two quotes you are given — read as one phrase */
.screen{background:#000;border:1px solid #262c44;border-radius:8px;overflow:hidden;margin-bottom:.7rem}
.qrow{display:flex;gap:.6rem;align-items:baseline;padding:.6rem .9rem;
  border-top:1px solid rgba(207,214,228,.35)}
.qrow:first-child{border-top:0}
.qinst{font-family:var(--mono);font-weight:700;color:#49ff62;font-size:1.35rem;letter-spacing:.02em}
.qside{font-family:var(--mono);font-size:1rem;color:#8fa8c8}
.qpx{font-family:var(--mono);font-size:1.35rem;font-weight:700;color:#ffe89c}
.qrow.fresh{background:rgba(73,255,98,.09)}
.qrow .qtag{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;color:var(--green);
  border:1px solid rgba(57,255,139,.5);border-radius:4px;padding:0 .25rem;margin-left:auto}
.imps{background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:.6rem .8rem;margin-bottom:.7rem}
.imps .ihd{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--muted);margin-bottom:.4rem}
.irow{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;padding:.22rem 0;
  border-top:1px solid rgba(29,39,64,.9)}
.irow:first-of-type{border-top:0}
.iinst{font-family:var(--mono);font-weight:700;color:var(--cyan);font-size:.95rem;min-width:5.2rem}
.iside{font-family:var(--mono);font-size:.78rem;color:var(--muted);min-width:3rem}
.ipx{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:1.05rem;min-width:4.2rem;text-align:right}
.ivia{font-family:var(--mono);font-size:.72rem;color:var(--muted);flex:1 1 100%}
.feedask{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-bottom:.6rem}
.choice .mkt{font-size:1.05rem!important}
.fb-deriv{font-family:var(--mono);font-size:.78rem;line-height:1.6}
</style>

<script type="text/babel" data-presets="react">
// ==PURE-BEGIN== (plain JS, no JSX — extracted and run under node for tests)

// ---- the board: the desk's real curve, prices held as whole 1/8s ----
var CURVE = [
  { k:'1y',  lbl:'1',   px:165.75  },
  { k:'18m', lbl:'18m', px:179.375 },
  { k:'2y',  lbl:'2',   px:189.25  },
  { k:'3y',  lbl:'3',   px:204.25  },
  { k:'4y',  lbl:'4',   px:214.25  },
  { k:'5y',  lbl:'5',   px:225.875 },
  { k:'6y',  lbl:'6',   px:235.375 },
  { k:'7y',  lbl:'7',   px:244.875 },
  { k:'8y',  lbl:'8',   px:253.25  },
  { k:'9y',  lbl:'9',   px:262.25  },
  { k:'10y', lbl:'10',  px:270.5   }
];
var BASE8 = CURVE.map(function(t){ return Math.round(t.px * 8); });   // eighths, integer

function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[ri(0,a.length-1)]; }
function shuffleArr(a){ for (let i=a.length-1;i>0;i--){ const j=ri(0,i), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function oppSide(s){ return s === 'bid' ? 'offer' : 'bid'; }

// prices print the way the desk sheet prints them: plain decimals
function fmt(e8){
  const v = e8 / 8;
  let s = v.toFixed(3);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}

// ---- instruments as weight vectors over tenor indices ----
// outright n = {n:+1}; spread a x b = {a:-1, b:+1}; fly a x b x c = {a:-1, b:+2, c:-1}
function mkO(i){ return { kind:'o', t:[i] }; }
function mkS(a,b){ return { kind:'s', t:[a,b] }; }
function mkF(a,b,c){ return { kind:'f', t:[a,b,c] }; }
function wvec(inst){
  const w = {};
  const add = function(i,v){ w[i] = (w[i]||0) + v; };
  if (inst.kind === 'o') add(inst.t[0], 1);
  else if (inst.kind === 's'){ add(inst.t[0], -1); add(inst.t[1], 1); }
  else { add(inst.t[0], -1); add(inst.t[1], 2); add(inst.t[2], -1); }
  return w;
}
// weight-sum: 1 for an outright, 0 for every spread and fly. Combinations of
// zero-sum instruments stay zero-sum, which is why structures can never make
// an outright.
function wsum(inst){
  const w = wvec(inst);
  return Object.keys(w).reduce(function(a, k){ return a + w[k]; }, 0);
}
function instLabel(inst){
  if (inst.kind === 'o') return CURVE[inst.t[0]].k;
  return inst.t.map(function(i){ return CURVE[i].lbl; }).join('x');
}
function instKey(inst){ return inst.kind + ':' + inst.t.join(','); }
function instValue(inst, px8){
  const w = wvec(inst);
  let v = 0;
  Object.keys(w).forEach(function(k){ v += w[k] * px8[k]; });
  return v;
}
// read a weight vector back as a nameable instrument, or null
function recognize(w){
  const e = Object.keys(w).map(function(k){ return [ +k, w[k] ]; })
    .filter(function(p){ return p[1] !== 0; })
    .sort(function(x,y){ return x[0] - y[0]; });
  if (e.length === 1 && e[0][1] === 1) return mkO(e[0][0]);
  if (e.length === 2 && e[0][1] === -1 && e[1][1] === 1) return mkS(e[0][0], e[1][0]);
  if (e.length === 3 && e[0][1] === -1 && e[1][1] === 2 && e[2][1] === -1)
    return mkF(e[0][0], e[1][0], e[2][0]);
  return null;
}

// ---- the identity search: what do these quotes make? ----
var COEFS = [1, -1, 2, -2, 0.5, -0.5];
function combineW(srcs, coefs){
  const w = {};
  srcs.forEach(function(s, i){
    const v = wvec(s);
    Object.keys(v).forEach(function(k){ w[k] = (w[k]||0) + coefs[i]*v[k]; });
  });
  return w;
}
// every target derivable from these sources, with the coefficients that get you there
function derivations(srcs, allowed){
  const coefSet = allowed || COEFS;
  const out = [], seen = {}, srcKeys = {};
  srcs.forEach(function(s){ srcKeys[instKey(s)] = 1; });
  const walk = function(i, acc){
    if (i === srcs.length){
      const T = recognize(combineW(srcs, acc));
      if (!T || srcKeys[instKey(T)]) return;
      const key = instKey(T);
      if (seen[key]) return;
      seen[key] = 1;
      out.push({ target: T, coefs: acc.slice() });
      return;
    }
    coefSet.forEach(function(c){ acc.push(c); walk(i+1, acc); acc.pop(); });
  };
  walk(0, []);
  return out;
}

// ---- side algebra ----
// target side S: a positive coefficient takes the source's S side, a negative
// coefficient takes the opposite side. (the whole rulebook, in one line)
function reqSides(coefs, targetSide){
  return coefs.map(function(c){ return c > 0 ? targetSide : oppSide(targetSide); });
}
// quotes: [{inst, side, px8}] in the same order as the coefficients
function solve(quotes, d, targetSide){
  const need = reqSides(d.coefs, targetSide);
  let v = 0;
  for (let i = 0; i < quotes.length; i++) v += d.coefs[i] * quotes[i].px8;
  const exact = need.every(function(s, i){ return s === quotes[i].side; });
  return { target: d.target, side: targetSide, px8: v, coefs: d.coefs,
           need: need, exact: exact, onGrid: Number.isInteger(v) };
}
// everything these quotes make, on the side asked for
function whatCanYouMake(quotes, targetSide, allowed){
  const srcs = quotes.map(function(q){ return q.inst; });
  return derivations(srcs, allowed)
    .map(function(d){ return solve(quotes, d, targetSide); })
    .filter(function(r){ return r.onGrid; });
}

// A doubled leg is not a special rule, it is two ordinary steps run together:
// 1x2 offer = 1x3 offer − 2x3 bid, then 1x2x3 offer = 1x2 offer − 2x3 bid,
// which collapses to 1x3 offer − 2 x (2x3 bid). Recover the two steps so the
// feedback reads the way the desk says it.
var STEP = [1, -1, 0.5, -0.5];
function chainOf(srcs, coefs){
  if (coefs.every(function(c){ return Math.abs(c) !== 2; })) return null;
  const want = coefs.join(',');
  for (let i = 0; i < STEP.length; i++) for (let j = 0; j < STEP.length; j++){
    const c1 = [STEP[i], STEP[j]];
    const mid = recognize(combineW(srcs, c1));
    if (!mid || srcs.some(function(x){ return instKey(x) === instKey(mid); })) continue;
    for (let k = 0; k < srcs.length; k++)
      for (let a = 0; a < STEP.length; a++) for (let b = 0; b < STEP.length; b++){
        const c2 = srcs.map(function(_, m){ return STEP[a]*c1[m] + (m === k ? STEP[b] : 0); });
        if (c2.join(',') !== want) continue;
        return { mid: mid, midCoefs: c1, useMid: STEP[a], leg: k, legCoef: STEP[b] };
      }
  }
  return null;
}

// ---- quotes on the board ----
// A curve moves nearly in parallel. Shocking each tenor on its own is what
// wrecks the relative values: a spread becomes the difference of two shocks
// and a fly of three, so a 7x8x9 that truly sits at -0.625 would print at
// -2.25. The session move is therefore level + slope + a token wobble, which
// moves outrights a lot, spreads a little and flies barely at all.
function driftCurve(){
  const level8 = ri(-16, 16) * 2;        // parallel shift: +/-4bp, the big move
  const slope8 = ri(-8, 8);              // total tilt across the curve: +/-1bp
  const n = BASE8.length - 1;
  return BASE8.map(function(p, i){
    return p + level8                    // every tenor moves together
             + Math.round(slope8 * i / n)// graded, so spreads move only a little
             + ri(-1, 1);                // 1/8 of idiosyncratic wobble, no more
  });
}
function instWidth(inst){ return inst.kind === 'o' ? 4 : 2; }   // 0.5 on outrights, 0.25 on structures
function quoteOf(inst, side, px8){
  const mid = instValue(inst, px8), w = instWidth(inst);
  return { inst: inst, side: side, px8: mid + (side === 'offer' ? w/2 : -w/2) };
}

// ---- the combinations the desk actually runs ----
// indices: 0=1y 1=18m 2=2y 3=3y 4=4y 5=5y 6=6y 7=7y 8=8y 9=9y 10=10y
// TIGHT is the bread and butter — one-year gaps. WIDE is the even-gap and
// round-anchored set (3x5x7, 5x7x10, 5x10, 7x10). Nothing outside these.
var TRIPLES_TIGHT = [
  [0,1,2], [1,2,3], [0,2,3], [2,3,4], [3,4,5],
  [4,5,6], [5,6,7], [6,7,8], [7,8,9], [8,9,10]
];
var TRIPLES_WIDE = [
  [0,3,5], [2,4,6], [3,5,7], [4,6,8], [5,7,9], [6,8,10],
  [5,7,10], [5,8,10], [2,5,7], [2,3,5], [7,8,10], [7,9,10], [2,5,10]
];
function pickTriple(mix){
  const wide = mix === 'wide' ? 0.45 : 0.2;
  return Math.random() < wide ? pick(TRIPLES_WIDE) : pick(TRIPLES_TIGHT);
}

var STAGES = [
  { n:1, nm:'EASY',   ds:'outright + spread, and spread + spread',
    pairs:[['o','s'],['s','o'],['o','o'],['s','s']], coefs:[1,-1], mix:'tight' },
  { n:2, nm:'MEDIUM', ds:'flies both ways — fly from two spreads, spread from fly',
    pairs:[['s','s'],['f','s'],['s','f']], coefs:[1,-1], mix:'tight' },
  { n:3, nm:'HARD',   ds:'halving and the doubled leg, on the wider tenor gaps',
    pairs:[['s','f'],['f','s'],['s','s']], coefs:[1,-1,2,-2,0.5,-0.5], mix:'wide' }
];

function poolOn(t){                       // t = [a,b,c] ascending tenor indices
  return { o:[mkO(t[0]), mkO(t[1]), mkO(t[2])],
           s:[mkS(t[0],t[1]), mkS(t[1],t[2]), mkS(t[0],t[2])],
           f:[mkF(t[0],t[1],t[2])] };
}

// Every question shows the sides the identity needs, so every question has a
// real answer. Two offers imply nothing: 18mx3 offer - 18mx2 offer is not a
// 2x3 offer, it wants the 18mx2 BID. The generator never asks that.
function genCombo(stageNo){
  const st = STAGES[stageNo-1];
  for (let tries = 0; tries < 60; tries++){
    const px8 = driftCurve();
    const t = pickTriple(st.mix);
    const pool = poolOn(t);
    const kinds = pick(st.pairs);
    const A = pick(pool[kinds[0]]), B = pick(pool[kinds[1]]);
    if (instKey(A) === instKey(B)) continue;
    // the board runs down the curve: shortest tenor on top, longest underneath
    const KIND_ORD = { o:0, s:1, f:2 };
    const srcs = [A, B].sort(function(x, y){
      const xa = Math.min.apply(null, x.t), ya = Math.min.apply(null, y.t);
      if (xa !== ya) return xa - ya;
      const xb = Math.max.apply(null, x.t), yb = Math.max.apply(null, y.t);
      if (xb !== yb) return xb - yb;
      return KIND_ORD[x.kind] - KIND_ORD[y.kind];
    });
    const ds = derivations(srcs, st.coefs);
    if (!ds.length) continue;
    const targetSide = pick(['bid','offer']);

    // the sides one real identity demands - that is what goes on the board
    const sides = reqSides(pick(ds).coefs, targetSide);

    const quotes = [quoteOf(srcs[0], sides[0], px8), quoteOf(srcs[1], sides[1], px8)];
    // and the answer is everything those exact sides prove, nothing else
    const items = whatCanYouMake(quotes, targetSide, st.coefs)
      .filter(function(r){ return r.exact; });
    if (!items.length || items.length > 2) continue;
    items.sort(function(x,y){ return instLabel(x.target).localeCompare(instLabel(y.target)); });
    return { stage: stageNo, quotes: quotes, items: items,
             targetSide: targetSide, tenors: t,
             family: famOf(quotes, items) };
  }
  return null;
}
function famOf(quotes, items){
  const k = quotes.map(function(q){ return q.inst.kind; }).sort().join('');
  const half = items.some(function(r){ return r.coefs.some(function(c){ return Math.abs(c) === 0.5; }); });
  const dbl  = items.some(function(r){ return r.coefs.some(function(c){ return Math.abs(c) === 2; }); });
  return k + (half ? '/half' : dbl ? '/x2' : '');
}

// ---- THE FEED: a board that accumulates, and everything it implies ----
// Four tenors name every instrument you can write on them: the outrights, the
// spreads between them, the flies across them.
function sectorRows(t){
  const u = [];
  for (let i = 0; i < t.length; i++) u.push(mkO(t[i]));
  for (let i = 0; i < t.length; i++) for (let j = i+1; j < t.length; j++) u.push(mkS(t[i], t[j]));
  for (let i = 0; i < t.length; i++) for (let j = i+1; j < t.length; j++)
    for (let k = j+1; k < t.length; k++) u.push(mkF(t[i], t[j], t[k]));
  return u;
}
// Which pair makes what is pure algebra on the instruments, so work it out once
// for the sector. After that a quote landing is only arithmetic.
function sectorPlan(rows){
  const plan = {};
  rows.forEach(function(A){ rows.forEach(function(B){
    if (instKey(A) === instKey(B)) return;
    const list = [];
    COEFS.forEach(function(c1){ COEFS.forEach(function(c2){
      const T = recognize(combineW([A,B],[c1,c2]));
      if (T) list.push({ c1:c1, c2:c2, T:T,
                         bid: reqSides([c1,c2],'bid'), offer: reqSides([c1,c2],'offer') });
    }); });
    if (list.length) plan[instKey(A) + '>' + instKey(B)] = list;
  }); });
  return plan;
}
// An implied price is the true mid plus or minus sum(|c| x width)/2 — every leg
// you go through widens it. Two routes to the same price therefore land on
// different levels, and a board carries the best one it can make. So this is a
// relaxation, not a first-one-wins: a tighter route replaces a wider one and
// everything built on it is worked out again.
function tighter(side, a, b){ return side === 'bid' ? a > b : a < b; }
function addQuote(board, plan, q){
  const k = instKey(q.inst) + '|' + q.side;
  // A quote worse than what the board already makes changes nothing — you still
  // show the better price. Taking it would also strand every route that stands
  // on the price it replaced, since only an improvement is propagated onward.
  if (board[k] && !tighter(q.side, q.px8, board[k].px8)) return board;
  board[k] = { inst:q.inst, side:q.side, px8:q.px8, via:null, depth:0 };
  const work = [board[k]];
  let guard = 0;
  while (work.length && guard++ < 40000){
    const E = work.pop();
    const known = Object.keys(board).map(function(x){ return board[x]; });
    for (let i = 0; i < known.length; i++){
      const pairs = [[E, known[i]], [known[i], E]];
      for (let p = 0; p < 2; p++){
        const A = pairs[p][0], B = pairs[p][1];
        const list = plan[instKey(A.inst) + '>' + instKey(B.inst)];
        if (!list) continue;
        for (let d = 0; d < list.length; d++){
          const r = list[d];
          const v = r.c1*A.px8 + r.c2*B.px8;
          if (!Number.isInteger(v)) continue;
          const sides = ['bid','offer'];
          for (let z = 0; z < 2; z++){
            const S = sides[z];
            if (r[S][0] !== A.side || r[S][1] !== B.side) continue;
            const key = instKey(r.T) + '|' + S;
            if (board[key] && !tighter(S, v, board[key].px8)) continue;
            board[key] = { inst:r.T, side:S, px8:v, via:{ a:A, b:B, coefs:[r.c1, r.c2] },
                           depth: Math.max(A.depth, B.depth) + 1 };

        }

}
function boardOf(quotes, plan){
  const board = {};
  quotes.forEach(function(q){ addQuote(board, plan, q); });

}
// what the board implies, shallowest first so a route reads after its legs
function impliedOf(board){
  return Object.keys(board).map(function(k){ return board[k]; })
    .filter(function(e){ return e.depth > 0; })
    .sort(function(x, y){ return x.depth - y.depth ||
      instLabel(x.inst).localeCompare(instLabel(y.inst)) ||
      x.side.localeCompare(y.side); });
}

// The sectors the desk actually works: mostly one-year steps, plus the wide
// anchors (3x5x7, 5x7x10, 5x10, 7x10).
var SECTORS_TIGHT = [
  [0,1,2,3], [1,2,3,4], [2,3,4,5], [3,4,5,6],
  [4,5,6,7], [5,6,7,8], [6,7,8,9], [7,8,9,10]
];
var SECTORS_WIDE = [
  [2,3,5,7], [3,5,7,10], [2,5,7,10], [5,7,8,10], [4,6,8,10], [2,4,6,8], [0,2,3,5]
];
// A fly and a spread to open, then another spread, then another fly, and on.
// The feed runs until the sector has nothing fresh left to quote.
var FEED_KINDS = ['f','s','s','f','s','f','s','f','s','f'];
var FEED_MIN = 6;
// Pace it: a quote that opens nothing is dead air, and one that opens the whole
// board at once is a wall. Prefer the ones that give you a few to work out.
function genFeed(){
  for (let attempt = 0; attempt < 30; attempt++){
    const sector = Math.random() < 0.35 ? pick(SECTORS_WIDE) : pick(SECTORS_TIGHT);
    const rows = sectorRows(sector);
    const plan = sectorPlan(rows);
    const px8 = driftCurve();
    const board = {}, quotes = [], opened = [];
    let dead = 0;
    for (let n = 0; n < FEED_KINDS.length; n++){
      // the kind this step wants, falling back to the other structure if the
      // sector has no fresh one of it left
      const want = FEED_KINDS[n], other = want === 'f' ? 's' : 'f';
      const fresh = function(k){
        return rows.filter(function(x){
          return x.kind === k && (!board[instKey(x) + '|bid'] || !board[instKey(x) + '|offer']); });
      };
      const of = fresh(want).length ? fresh(want) : fresh(other);
      const cands = [];
      of.forEach(function(inst){ ['bid','offer'].forEach(function(side){
        // never quote a price the board already carries: a dealer telling you
        // something you worked out yourself is not a new quote, and it would
        // quietly take back a line you had earned
        if (board[instKey(inst) + '|' + side]) return;
        const q = quoteOf(inst, side, px8);
        const clone = {};
        Object.keys(board).forEach(function(k){ clone[k] = board[k]; });
        const was = Object.keys(clone).length;
        addQuote(clone, plan, q);
        cands.push({ q: q, opens: Object.keys(clone).length - was - 1 });
      }); });
      if (!cands.length) break;
      const good = cands.filter(function(c){ return c.opens >= 1 && c.opens <= 5; });
      const some = cands.filter(function(c){ return c.opens > 0; });
      const ch = n === 0 ? pick(cands) : pick(good.length ? good : some.length ? some : cands);
      quotes.push(ch.q); addQuote(board, plan, ch.q); opened.push(ch.opens);
      if (n > 0 && ch.opens === 0) dead++;
    }
    // the second quote must open something, or the feed starts with nothing to do
    if (quotes.length < FEED_MIN || opened[1] < 1 || dead > 2) continue;
    return { sector: sector, rows: rows, plan: plan, quotes: quotes, px8: px8, opened: opened };
  }
  return null;
}

// ---- answers and the traps that are real mistakes ----
function sideWord(side, vocab){
  if (vocab !== 'gt') return side;
  return side === 'bid' ? 'given' : 'taken';
}
function itemText(r, withLevel, vocab){
  return instLabel(r.target) + ' ' + sideWord(r.side, vocab) + (withLevel ? ' ' + fmt(r.px8) : '');
}
function ansText(items, withLevel, vocab){
  return items.map(function(r){ return itemText(r, withLevel, vocab); }).join('  ·  ');
}
// "8y offer − 7y bid", never "−7y bid + 8y offer": positives lead
function termsText(parts, vocab){
  return parts.map(function(p){ return { c: p.c, lbl: instLabel(p.inst) + ' ' + sideWord(p.side, vocab) }; })
    .sort(function(x, y){ return (y.c > 0) - (x.c > 0); })
    .map(function(e, i){
      return (i ? (e.c < 0 ? ' − ' : ' + ') : (e.c < 0 ? '−' : '')) +
        (Math.abs(e.c) === 1 ? '' : Math.abs(e.c) === 0.5 ? '½×' : Math.abs(e.c) + '×') + e.lbl;
    }).join('');
}
// The lines of working behind one answer. A doubled leg is shown as the two
// steps it really is, through the instrument you make on the way.
function workings(quotes, r, vocab){
  const term = function(c, inst, side){ return { c: c, inst: inst, side: side }; };
  const one = function(){
    return [ instLabel(r.target) + ' ' + sideWord(r.side, vocab) + ' = ' +
      termsText(r.coefs.map(function(c, k){ return term(c, quotes[k].inst, quotes[k].side); }), vocab) +
      ' = ' + fmt(r.px8) ];
  };
  const ch = chainOf(quotes.map(function(q){ return q.inst; }), r.coefs);
  if (!ch) return one();
  // the intermediate is wanted on the side the second step takes it from
  const midSide = ch.useMid > 0 ? r.side : oppSide(r.side);
  // only show the chain if both steps really are provable from what is shown
  if (!reqSides(ch.midCoefs, midSide).every(function(sd, k){ return sd === quotes[k].side; }))
    return one();
  if ((ch.legCoef > 0 ? r.side : oppSide(r.side)) !== quotes[ch.leg].side) return one();
  let midV = 0; ch.midCoefs.forEach(function(c, k){ midV += c * quotes[k].px8; });
  return [
    instLabel(ch.mid) + ' ' + sideWord(midSide, vocab) + ' = ' +
      termsText(ch.midCoefs.map(function(c, k){ return term(c, quotes[k].inst, quotes[k].side); }), vocab) +
      ' = ' + fmt(midV),
    instLabel(r.target) + ' ' + sideWord(r.side, vocab) + ' = ' +
      termsText([ term(ch.useMid, ch.mid, midSide),
                  term(ch.legCoef, quotes[ch.leg].inst, quotes[ch.leg].side) ], vocab) +
      ' = ' + fmt(r.px8)
  ];
}
// The whole working, in the order you would do it at the desk. When a chain
// passes through an instrument that is itself part of the answer, that line is
// already there — write it once and build on it.
function allWorkings(quotes, items, vocab){
  const out = [], seen = {};
  items.forEach(function(r){
    workings(quotes, r, vocab).forEach(function(l){
      if (seen[l]) return;
      seen[l] = 1; out.push(l);
    });
  });
  return out;
}
function buildOptions(correct, traps, filler){
  const seen = {}; seen[correct] = 1;
  const t = [];
  traps.forEach(function(x){ if (x && !seen[x] && t.length < 3){ seen[x] = 1; t.push(x); } });
  let i = 0;
  while (t.length < 3 && i < filler.length){ const f = filler[i++]; if (!seen[f]){ seen[f] = 1; t.push(f); } }
  const options = shuffleArr(t.concat([correct]));
  return { options: options, correctIdx: options.indexOf(correct) };
}
function comboChoices(q, withLevel, vocab){
  const items = q.items;
  const correct = ansText(items, withLevel, vocab);
  const flip = function(r){ return { target:r.target, side:oppSide(r.side), px8:r.px8, coefs:r.coefs }; };
  const traps = [];
  traps.push(ansText(items.map(flip), withLevel, vocab));                       // every side flipped
  if (items.length === 2){
    traps.push(ansText([flip(items[0]), items[1]], withLevel, vocab));          // one side wrong
    traps.push(ansText([items[1], items[0]].map(function(r,i){           // values swapped
      return { target: items[i].target, side: items[i].side, px8: r.px8, coefs: r.coefs }; }), withLevel, vocab));
    traps.push(ansText([items[0]], withLevel, vocab));                          // only half the answer
  }
  if (withLevel){
    traps.push(ansText(items.map(function(r){                            // forgot to halve / doubled
      return { target:r.target, side:r.side, px8: r.px8 * 2, coefs:r.coefs }; }), withLevel, vocab));
    traps.push(ansText(items.map(function(r){
      return { target:r.target, side:r.side, px8: r.px8 + 8, coefs:r.coefs }; }), withLevel, vocab));

  const pool = poolOn(q.tenors);
  const have = {}; items.forEach(function(r){ have[instKey(r.target)] = 1; });
  q.quotes.forEach(function(qq){ have[instKey(qq.inst)] = 1; });
  // Only offer instruments these quotes could conceivably name. Spreads and
  // flies have weight-sum 0 and outrights 1, so no combination of structures
  // can ever reach an outright — offering one is not a trap, it is a category
  // error a broker discards without doing any arithmetic.
  const reach = q.quotes.reduce(function(a, z){ return a + wsum(z.inst); }, 0) === 0 ? 0 : null;
  const others = pool.s.concat(pool.f).concat(pool.o).filter(function(x){
    if (have[instKey(x)]) return false;
    return reach === 0 ? wsum(x) === 0 : true;
  });

  // only off the side you were not shown — a 7x8 offer from a 6x8 offer and a
  // fly offer. That is the whole mistake this drill exists to stop.
  const nearMiss = {};
  whatCanYouMake(q.quotes, items[0].side).forEach(function(r){
    if (!r.exact) nearMiss[instKey(r.target)] = 1;
  });
  shuffleArr(others).sort(function(x, y){
    return (nearMiss[instKey(y)] ? 1 : 0) - (nearMiss[instKey(x)] ? 1 : 0);
  }).slice(0, 3).forEach(function(o){
    // a real instrument on these tenors that these two quotes do NOT make
    traps.push(ansText([{ target:o, side:items[0].side, px8: items[0].px8, coefs:[] }].concat(items.slice(1)), withLevel, vocab));
    traps.push(ansText([{ target:o, side:oppSide(items[0].side), px8: items[0].px8, coefs:[] }].concat(items.slice(1)), withLevel, vocab));
  });

}
// ---- spaced-repetition-lite: weak and slow families come back sooner ----
function patKey(type, role, side, dir){ return type + '|' + role + '|' + side + '|' + dir; }

  if (!a.length) return 0;
  const s = a.slice().sort(function(x,y){ return x-y; });
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
}
function comboWeight(stats, key){
  const s = stats[key];
  if (!s || !s.n) return 2;                          // unseen: explore
  const acc = s.ok / s.n;
  let w = 0.5 + 3*(1-acc);
  w += Math.max(0, Math.min(1.5, median(s.times)/8000 - 0.5));   // slow → resurface
  if (s.lastWrong) w += 1.5;                         // just missed → resurface soon
  return Math.max(0.25, w);

function weightedPick(items, weights){
  let tot = 0;
  for (let i = 0; i < weights.length; i++) tot += weights[i];
  let r = Math.random()*tot;
  for (let i = 0; i < items.length; i++){ r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length-1];
}
function recordResult(stats, key, ok, ms){
  const s = stats[key] || (stats[key] = { n:0, ok:0, times:[] });
  s.n++; if (ok) s.ok++;
  s.lastWrong = !ok;
  s.times.push(ms);
  if (s.times.length > 50) s.times.shift();
}

var STORE_KEY = 'shift.v1';
function safeStore(){
  try { return (typeof localStorage !== 'undefined' && localStorage) ? localStorage : null; }
  catch (e){ return null; }
}
function loadState(store){
  try {
    const raw = store && store.getItem(STORE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || o.v !== 1 || !o.stats || typeof o.stats !== 'object') return null;
    return { stats: o.stats,
             settings: (o.settings && typeof o.settings === 'object') ? o.settings : {} };
  } catch (e){ return null; }
}
function saveState(store, stats, settings){
  try {
    if (!store) return false;
    store.setItem(STORE_KEY, JSON.stringify({ v:1, stats: stats, settings: settings, updatedAt: Date.now() }));
    return true;
  } catch (e){ return false; }
}
function clearState(store){
  try { if (!store) return false; store.removeItem(STORE_KEY); return true; }
  catch (e){ return false; }
}
// lifetime answers; the _bookStage/_callStage markers live in the same object
// and are plain numbers, so they must not be counted as pattern buckets
function careerCount(stats){
  let n = 0;
  Object.keys(stats || {}).forEach(function(k){
    const b = stats[k];
    if (b && typeof b.n === 'number') n += b.n;
  });
  return n;
}

    imp.forEach(function(e){
      // the route reproduces the level it claims
      if (e.via.coefs[0]*e.via.a.px8 + e.via.coefs[1]*e.via.b.px8 !== e.px8) xRoute++;
      // and both legs are the board's own current entries, not stale copies
      const pa = B[instKey(e.via.a.inst)+'|'+e.via.a.side];
      const pb = B[instKey(e.via.b.inst)+'|'+e.via.b.side];
      if (!pa || pa.px8 !== e.via.a.px8 || !pb || pb.px8 !== e.via.b.px8) xStale++;
      // an implied price is never better than the true mid - no free money
      const mid = instValue(e.inst, F.px8);
      if (e.side === 'offer' ? e.px8 < mid : e.px8 > mid) xFree++;
    });
    // and no implied market is ever crossed
    F.rows.forEach(function(inst){
      const b = B[instKey(inst)+'|bid'], o = B[instKey(inst)+'|offer'];
      if (b && o && b.px8 >= o.px8) xCross++;
    });
  }
  eq('feed: generated', feeds, FEEDS);
  eq('feed: the worklist closure equals the brute-force closure', xRef, 0);
  eq('feed: every route reproduces its own level', xRoute, 0);
  eq('feed: every route stands on the board\'s current prices', xStale, 0);
  eq('feed: no implied price is better than the true mid', xFree, 0);
  eq('feed: no implied market is ever crossed', xCross, 0);
  eq('feed: every step of the feed, not just the last, matches the reference', xStep, 0);
  eq('feed: the board never takes back a line it gave you', shrank, 0);
  eq('feed: quotes actually open prices as they land', opened > 0, true);
  eq('feed: every feed runs at least FEED_MIN quotes', minQuotes >= FEED_MIN, true);
  eq('feed: every feed leaves real work on the board', minImplied >= 8, true);
  eq('feed: it opens with a fly and a spread', FEED_KINDS.slice(0,3).join(''), 'fss');

  return { count: count, failed: failed };
}
// ==TESTS-END==

const { useState, useEffect, useRef, useCallback, useMemo } = React;

const QUESTIONS_PER_ROUND = 20;
const SPEED_MS = 12000;
const PROMOTE_RUN = 4;        // straight correct to go from sides-only to levels
const PROMOTE_PCT = 0.85;     // round accuracy to unlock the next stage

function famKeyOf(f){
  if (f.indexOf('/half') > 0) return 'half';
  if (f.indexOf('/x2') > 0) return 'x2';
  return f;
}
const HEAT_ROWS = [
  { f:'oo',   label:'outright + outright' },
  { f:'os',   label:'outright + spread' },
  { f:'ss',   label:'spread + spread' },
  { f:'fs',   label:'fly + spread' },
  { f:'half', label:'halving · long + fly' },
  { f:'x2',   label:'doubled leg · ×2' }
];
const HEAT_COLS = [
  { q:'sides',  label:'WHICH SIDE' },
  { q:'levels', label:'WITH LEVELS' },
  { q:'exact',  label:'EXACT?' }
];

function heatColor(acc){
  if (acc < 0.35) return { bg:'var(--heat-w3)', ink:'#0b0e17' };
  if (acc < 0.55) return { bg:'var(--heat-w2)', ink:'#f5f7ff' };
  if (acc < 0.70) return { bg:'var(--heat-w1)', ink:'#f5f7ff' };
  if (acc < 0.80) return { bg:'var(--heat-mid)', ink:'#e6ecfa' };
  if (acc < 0.90) return { bg:'var(--heat-s1)', ink:'#f5f7ff' };
  if (acc < 0.97) return { bg:'var(--heat-s2)', ink:'#f5f7ff' };
  return { bg:'var(--heat-s3)', ink:'#0b0e17' };
}
function HeatCell({ s, title }){
  if (!s || !s.n) return <td className="cell empty">—</td>;
  const acc = s.ok/s.n, col = heatColor(acc), med = median(s.times);
  return (
    <td className="cell" style={{ background: col.bg, color: col.ink }}
        title={title + ': ' + s.ok + '/' + s.n + ' correct, median ' + (med/1000).toFixed(1) + 's'}>
      <div className="a">{Math.round(acc*100)}%</div>
      <div className="m">{s.ok}/{s.n} · {(med/1000).toFixed(1)}s</div>
    </td>
  );
}
function HeatMap({ stats }){
  const keyOf = (r, c) => patKey('combo', r.f, c.q, 'x');
  const rows = HEAT_ROWS.filter(r => HEAT_COLS.some(c => { const s = stats[keyOf(r,c)]; return s && s.n > 0; }));
  if (!rows.length) return null;
  return (
    <div className="panel">
      <div className="panel-title">WHERE YOU ARE SLOW · cell: % correct · median seconds</div>
      <table className="heat">
        <thead><tr><th className="rowlab"></th>{HEAT_COLS.map(c => <th key={c.q}>{c.label}</th>)}</tr></thead>
        <tbody>
          {rows.map(r => (
            <tr key={r.f}>
              <td className="rowlab">{r.label}</td>
              {HEAT_COLS.map(c => <HeatCell key={c.q} s={stats[keyOf(r,c)]} title={r.label + ' · ' + c.label.toLowerCase()} />)}
            </tr>
          ))}
        </tbody>
      </table>
      <div className="legend">
        weak
        <span className="sw" style={{background:'var(--heat-w3)'}}></span>
        <span className="sw" style={{background:'var(--heat-w2)'}}></span>
        <span className="sw" style={{background:'var(--heat-w1)'}}></span>
        <span className="sw" style={{background:'var(--heat-mid)'}}></span>
        <span className="sw" style={{background:'var(--heat-s1)'}}></span>
        <span className="sw" style={{background:'var(--heat-s2)'}}></span>
        <span className="sw" style={{background:'var(--heat-s3)'}}></span>
        strong · weak families come back sooner
      </div>
    </div>
  );
}

// THE FEED — quotes land one at a time, you work the implieds on paper, and
// REVEAL checks you. Nothing to type: the whole point is the paper.
function Feed({ vocab, onMenu }){
  const [feed, setFeed] = useState(() => genFeed());
  const [n, setN] = useState(1);
  const [shown, setShown] = useState(false);
  const quotes = useMemo(() => feed ? feed.quotes.slice(0, n) : [], [feed, n]);
  const implied = useMemo(
    () => feed ? impliedOf(boardOf(quotes, feed.plan)) : [], [feed, quotes]);
  const done = !!feed && n >= feed.quotes.length;

  const next = useCallback(() => {
    if (done) return;
    setShown(false); setN(function(x){ return x + 1; });
  }, [done]);
  const again = useCallback(() => { setFeed(genFeed()); setN(1); setShown(false); }, []);

  useEffect(() => {
    const h = (e) => {
      if (e.key === 'Escape'){ e.preventDefault(); onMenu(); return; }
      if (e.key === 'r' || e.key === 'R'){ e.preventDefault(); setShown(function(x){ return !x; }); return; }
      if (e.key === 'n' || e.key === 'N' || e.key === 'Enter'){
        e.preventDefault(); if (done) again(); else next(); }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [next, again, done, onMenu]);

  if (!feed) return (
    <div><div className="err">could not build a feed — reload</div>
      <div className="btnrow"><button type="button" className="btn" onClick={onMenu}>MENU</button></div></div>
  );

  window.__feed = { n: n, quotes: quotes, implied: implied, shown: shown, done: done };
  return (
    <div>
      <div className="hud">
        <span><b>{feed.sector.map(function(i){ return CURVE[i].lbl; }).join('·')}</b></span>
        <span>Q <b>{n}/{feed.quotes.length}</b></span>
        <span><b>{implied.length}</b> {shown ? 'shown' : 'to find'}</span>
        <span style={{marginLeft:'auto'}}>
          <button type="button" className="btn end" onClick={onMenu}>END ✕</button>
        </span>
      </div>
      <div className="screen">
        {quotes.map((q, i) => (
          <div className={'qrow' + (i === quotes.length - 1 ? ' fresh' : '')} key={i}>
            <span className="qinst">{instLabel(q.inst)}</span>
            <span className="qside">{sideWord(q.side, vocab)}</span>
            <span className="qpx">{fmt(q.px8)}</span>
            {i === quotes.length - 1 && <span className="qtag">JUST IN</span>}
          </div>
        ))}
      </div>
      <div className="feedask">
        {implied.length === 0
          ? 'nothing implied yet — wait for the next one'
          : 'write every price this board now implies, then check yourself'}
      </div>
      {shown && (
        <div className="imps">
          <div className="ihd">{implied.length} IMPLIED — BEST PRICE THE BOARD CAN MAKE</div>
          {implied.map((e, i) => (
            <div className="irow" key={i}>
              <span className="iinst">{instLabel(e.inst)}</span>
              <span className="iside">{sideWord(e.side, vocab)}</span>
              <span className="ipx">{fmt(e.px8)}</span>
              <span className="ivia">= {termsText(
                [{ c: e.via.coefs[0], inst: e.via.a.inst, side: e.via.a.side },
                 { c: e.via.coefs[1], inst: e.via.b.inst, side: e.via.b.side }], vocab)}</span>
            </div>
          ))}
        </div>
      )}
      <div className="btnrow">
        <button type="button" className={'btn' + (shown ? '' : ' primary')}
                onClick={() => setShown(function(x){ return !x; })}>
          {shown ? 'HIDE · R' : 'REVEAL ▾\u00a0\u00a0R'}</button>
        {done
          ? <button type="button" className="btn primary" onClick={again}>NEW FEED ▸&nbsp;&nbsp;N</button>
          : <button type="button" className="btn" onClick={next}>NEXT QUOTE ▸&nbsp;&nbsp;N</button>}
        <button type="button" className="btn" onClick={onMenu}>MENU · ESC</button>
      </div>
      {done && <div className="hint" style={{marginTop:'.5rem'}}>
        board complete — the sector has nothing fresh left to quote</div>}
    </div>
  );
}

// pick a question, leaning on the families this user is weakest at
function pickCombo(stage, stats, qtype){
  let best = null, bw = -1;
  for (let i = 0; i < 6; i++){
    const c = genCombo(stage);
    if (!c) continue;
    const w = comboWeight(stats, patKey('combo', famKeyOf(c.family), qtype, 'x'));
    if (w > bw){ bw = w; best = c; }
  }
  return best || genCombo(stage);
}

function ComboDrill({ stage, speed, blind, vocab, statsRef, onEnd }){
  const historyRef = useRef([]);
  const runRef = useRef(0);
  const makeQ = useCallback((n, step) => {
    const c = pickCombo(stage, statsRef.current, step);
    return { n: n, step: step, combo: c, choices: comboChoices(c, step === 'levels', vocab),
             key: patKey('combo', famKeyOf(c.family), step, 'x') };
  }, [stage, vocab, statsRef]);
  const [q, setQ] = useState(() => makeQ(1, 'sides'));
  const [phase, setPhase] = useState('answer');
  const [fb, setFb] = useState(null);
  const [seen, setSeen] = useState(!blind);
  const [remaining, setRemaining] = useState(SPEED_MS);
  const t0 = useRef(0);
  window.__q = q; window.__stage = stage;

  useEffect(() => { t0.current = performance.now(); setRemaining(SPEED_MS); }, [q.n, seen]);

  const submit = useCallback((idx) => {
    const ms = Math.round(performance.now() - t0.current);
    const ok = idx === q.choices.correctIdx;
    recordResult(statsRef.current, q.key, ok, ms);
    historyRef.current.push({ key: q.key, ok: ok, ms: ms });
    let promoted = false;
    if (q.step === 'sides'){
      runRef.current = ok ? runRef.current + 1 : 0;
      if (runRef.current >= PROMOTE_RUN) promoted = true;
    }
    setFb({ ok: ok, ms: ms, timeout: idx === -1, promoted: promoted });
    setPhase('feedback');
  }, [q, stage, statsRef]);

  const next = useCallback(() => {
    const h = historyRef.current;
    if (q.n >= QUESTIONS_PER_ROUND){
      const okN = h.filter(x => x.ok).length;
      if (okN / h.length >= PROMOTE_PCT && stage < 3)
        statsRef.current._stage = Math.max(statsRef.current._stage || 1, stage + 1);
      onEnd(h); return;
    }
    const step = (fb && fb.promoted) ? 'levels' : q.step;
    setFb(null); setPhase('answer'); setSeen(!blind);
    setQ(makeQ(q.n + 1, step));
  }, [q, fb, blind, stage, makeQ, statsRef, onEnd]);

  useEffect(() => {
    if (!speed || phase !== 'answer' || !seen) return;
    const iv = setInterval(() => {
      const left = SPEED_MS - (performance.now() - t0.current);
      setRemaining(left);
      if (left <= 0) submit(-1);
    }, 100);
    return () => clearInterval(iv);
  }, [speed, phase, q.n, submit, seen]);

  useEffect(() => {
    const h = (e) => {
      if (e.key === 'Escape'){ e.preventDefault(); onEnd(historyRef.current); return; }
      if (!seen){
        if (e.key === 'n' || e.key === 'N' || e.key === 'Enter'){ e.preventDefault(); setSeen(true); }
        return;
      }
      if (phase === 'feedback' && (e.key === 'n' || e.key === 'N' || e.key === 'Enter')){
        e.preventDefault(); next(); return;
      }
      if (phase === 'answer' && e.key >= '1' && e.key <= '4'){
        if (q.choices.options[+e.key - 1] != null){ e.preventDefault(); submit(+e.key - 1); }
      }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [phase, next, submit, onEnd, q, seen]);

  const streak = (() => { let n = 0; const h = historyRef.current;
    for (let i = h.length-1; i >= 0 && h[i].ok; i--) n++; return n; })();
  const ask = 'what can you make on the ' + sideWord(q.combo.targetSide, vocab) + ' side?';

  return (
    <div>
      <div className="hud">
        <span>STAGE <b>{stage}</b></span>
        <span>Q <b>{q.n}/{QUESTIONS_PER_ROUND}</b></span>
        <span>STREAK <b>{streak}</b></span>
        <span>{q.step === 'sides' ? 'SIDES ONLY' : 'WITH LEVELS'}</span>
        <span style={{marginLeft:'auto'}}>
          <button type="button" className="btn end" onClick={() => onEnd(historyRef.current)}>END ✕</button>
        </span>
      </div>
      <QuotePanel quotes={q.combo.quotes} vocab={vocab} hidden={blind && seen} />
      {!seen && (
        <div className="btnrow" style={{marginBottom:'.6rem'}}>
          <button type="button" className="btn primary" onClick={() => setSeen(true)}>GOT IT ▸&nbsp;&nbsp;N</button>
        </div>
      )}
      {seen && <React.Fragment>
      <div className="task">
        <span className="task-label">MAKE IT</span>
        <span className="task-text">{ask}</span>
        {speed && phase === 'answer' && <span className="clock">{Math.max(0, remaining/1000).toFixed(1)}s</span>}
      </div>
      {phase === 'answer' ? (
        <div className="choices">
          <div className="anshdr">YOUR ANSWER · press 1–4 or tap</div>
          {q.choices.options.map((o, i) => (
            <div key={q.n + '-' + i} className="choice" onClick={() => submit(i)}>
              <span className="cnum">{i + 1}</span>
              <span className="mkt" style={{fontSize:'.98rem', whiteSpace:'normal'}}>{o}</span>
            </div>
          ))}
        </div>
      ) : (
        <div className={'fb ' + (fb.ok ? 'ok' : 'bad')}>
          <div className="fb-line1">
            <span className="verdict">{fb.ok ? 'CORRECT' : fb.timeout ? 'TIME OUT' : 'WRONG'}</span>
            <span className="ms">{(fb.ms/1000).toFixed(2)}s</span>
            <span className="stk">streak {streak}</span>
          </div>
          <div className="fb-ans" style={{fontSize:'1.05rem'}}>{q.choices.options[q.choices.correctIdx]}</div>
          {allWorkings(q.combo.quotes, q.combo.items, vocab).map((line, i) => (
            <div className="fb-deriv" key={i}>{line}</div>
          ))}
          {fb.promoted && <div className="fb-swap">STEP UP — levels from the next question</div>}
          <div className="btnrow">
            <button type="button" className="btn primary" onClick={next}>NEXT ▸&nbsp;&nbsp;N</button>
          </div>
        </div>
      )}
      </React.Fragment>}
    </div>
  );
}

function Summary({ history, stats, onRestart, onMenu }){
  useEffect(() => {
    const h = (e) => {
      if (e.key === 'r' || e.key === 'R' || e.key === 'Enter'){ e.preventDefault(); onRestart(); }
      if (e.key === 'l' || e.key === 'L' || e.key === 'Escape'){ e.preventDefault(); onMenu(); }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onRestart, onMenu]);
  const n = history.length, okN = history.filter(x => x.ok).length;
  let best = 0, cur = 0;
  history.forEach(x => { cur = x.ok ? cur+1 : 0; if (cur > best) best = cur; });
  const okTimes = history.filter(x => x.ok).map(x => x.ms);
  const fastest = okTimes.length ? Math.min.apply(null, okTimes) : null;
  const med = okTimes.length ? median(okTimes) : null;
  return (
    <div>
      <div className="tiles">
        <div className="tile"><div className="v">{okN}/{n}</div><div className="l">CORRECT</div></div>
        <div className="tile"><div className="v">{best}</div><div className="l">BEST STREAK</div></div>
        <div className="tile"><div className="v">{fastest != null ? (fastest/1000).toFixed(2)+'s' : '—'}</div><div className="l">BEST TIME</div></div>
        <div className="tile"><div className="v">{med != null ? (med/1000).toFixed(2)+'s' : '—'}</div><div className="l">MEDIAN</div></div>

  );
}

      </div>
      {phase === 'feed' && <Feed vocab={vocab} onMenu={() => setPhase('menu')} />}
      {phase === 'menu' &&
        <Menu speed={speed} blind={blind} vocab={vocab} reached={reached}
              career={careerCount(statsRef.current)} storeOk={storeOk} testResult={testResult}
              onStart={s => { setStage(s); setRoundId(r => r+1); setPhase('drill'); }}
              onFeed={() => setPhase('feed')}
              onToggleSpeed={() => setSpeed(x => !x)}
              onToggleBlind={() => setBlind(x => !x)}
              onToggleVocab={() => setVocab(v => v === 'gt' ? 'bo' : 'gt')}
              onReset={resetProgress} />}
      {phase === 'drill' &&
        <ComboDrill key={roundId} stage={stage} speed={speed} blind={blind}
                    vocab={vocab} statsRef={statsRef} onEnd={endRound} />}
      {phase === 'summary' &&
        <Summary history={lastHistory} stats={statsRef.current}
                 onRestart={() => { setRoundId(r => r+1); setPhase('drill'); }}
                 onMenu={() => setPhase('menu')} />}
    </div>
  );
}

window.__APP_MOUNTED = true;
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    if (!window.__APP_MOUNTED)
      document.getElementById('root').innerHTML =
        '<div class="loadfail">Could not load React/Babel from the CDN — check your connection and reload.</div>';
  }, 1500);
  // offline shell, so the trainer opens on a platform with no signal
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(function(){});
});
</script>
</body>
</html>
